name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Lint
        run: pnpm lint

      - name: Brand lint (H-17)
        run: |
          node --test scripts/check-brand.test.ts
          pnpm check-brand

      - name: Build
        run: pnpm build
        env:
          SANCHAY_PLATFORM_ARN: ARN-000000 # clearly fake CI fixture; real value comes from the deploy env
          SANCHAY_PLATFORM_ARN_VALID_TILL: '2099-12-31'

      - name: Typecheck
        run: pnpm typecheck
        env:
          SANCHAY_PLATFORM_ARN: ARN-000000 # clearly fake CI fixture; real value comes from the deploy env
          SANCHAY_PLATFORM_ARN_VALID_TILL: '2099-12-31'

      - name: Test
        run: pnpm test
        env:
          SANCHAY_PLATFORM_ARN: ARN-000000 # clearly fake CI fixture; real value comes from the deploy env
          SANCHAY_PLATFORM_ARN_VALID_TILL: '2099-12-31'
      - name: Integration tests (Testcontainers)
        run: pnpm test:int
      - name: DB drift
        run: pnpm --filter=@sanchay/api db:check
      - name: States drift
        run: |
          pnpm gen:states
          git diff --exit-code docs/specs/states.md

      - name: Secret scan (gitleaks)
        run: >-
          docker run --rm
          -e GIT_CONFIG_COUNT=1
          -e GIT_CONFIG_KEY_0=safe.directory
          -e GIT_CONFIG_VALUE_0=/repo
          -v "${GITHUB_WORKSPACE}:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --no-banner --config /repo/.gitleaks.toml /repo

      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high

  e2e-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TURBO_TELEMETRY_DISABLED: 1
      SANCHAY_PLATFORM_ARN: ARN-000000 # clearly fake CI fixture; real value comes from the deploy env
      SANCHAY_PLATFORM_ARN_VALID_TILL: '2099-12-31' # clearly fake CI fixture
      SANCHAY_API_ORIGIN: http://localhost:3000
      MAILPIT_URL: http://localhost:8025
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: sanchay
          POSTGRES_PASSWORD: sanchay_local_only
          POSTGRES_DB: sanchay
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U sanchay -d sanchay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.31.2@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
        ports:
          - 8025:8025
          - 1025:1025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create apps/api/.env with throwaway keys (CI only)
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { randomBytes } from 'node:crypto';
          let text = readFileSync('apps/api/.env.example', 'utf8');
          for (const key of ['SANCHAY_LOCAL_PII_KEY', 'SANCHAY_LOCAL_BIDX_KEY', 'SANCHAY_OTP_PEPPER', 'SANCHAY_AUTH_TOKEN_KEY']) {
            const value = randomBytes(32).toString('base64');
            console.log(`::add-mask::${value}`);
            text = text.replace(new RegExp(`^${key}=.*$`, 'm'), `${key}=${value}`);
          }
          writeFileSync('apps/api/.env', text);
          EOF

      - name: Build the API and its packages
        run: pnpm turbo run build --filter=@sanchay/api...

      - name: Migrate
        run: pnpm db:migrate

      - name: Install Chromium
        run: pnpm --filter=@sanchay/web exec playwright install --with-deps chromium

      - name: Web e2e (shell + @api)
        run: pnpm e2e:web

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
