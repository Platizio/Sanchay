name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Lint
        run: pnpm lint

      - name: Brand lint (H-17)
        run: |
          node --test scripts/check-brand.test.ts
          pnpm check-brand

      - name: Build
        run: pnpm build
        env:
          SANCHAY_PLATFORM_ARN: ARN-000000 # clearly fake CI fixture; real value comes from the deploy env
          SANCHAY_PLATFORM_ARN_VALID_TILL: '2099-12-31'

      - name: Typecheck
        run: pnpm typecheck
        env:
          SANCHAY_PLATFORM_ARN: ARN-000000 # clearly fake CI fixture; real value comes from the deploy env
          SANCHAY_PLATFORM_ARN_VALID_TILL: '2099-12-31'

      - name: Test
        run: pnpm test
        env:
          SANCHAY_PLATFORM_ARN: ARN-000000 # clearly fake CI fixture; real value comes from the deploy env
          SANCHAY_PLATFORM_ARN_VALID_TILL: '2099-12-31'
      - name: Integration tests (Testcontainers)
        run: pnpm test:int
      - name: DB drift
        run: pnpm --filter=@sanchay/api db:check

      - name: Secret scan (gitleaks)
        run: >-
          docker run --rm
          -e GIT_CONFIG_COUNT=1
          -e GIT_CONFIG_KEY_0=safe.directory
          -e GIT_CONFIG_VALUE_0=/repo
          -v "${GITHUB_WORKSPACE}:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --no-banner --config /repo/.gitleaks.toml /repo

      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high
