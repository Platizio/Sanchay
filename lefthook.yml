pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,mjs,cjs,ts,mts,cts,tsx,jsx,json,jsonc,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - name: gitleaks
      run: gitleaks git --pre-commit --staged --redact --no-banner

pre-push:
  jobs:
    - name: typecheck-affected
      run: "pnpm turbo run typecheck --filter='...[origin/main]' || pnpm turbo run typecheck"
