packages:
  - apps/*
  - packages/*
  - tools/*

nodeLinker: hoisted
engineStrict: true

# Supply chain (H-16, D-PLATFORM-112). Key names verified against pnpm docs 2026-09-25; see ADR-0001.
strictDepBuilds: true
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
blockExoticSubdeps: true
trustPolicy: no-downgrade

# H-16/A1 rule: an install error about `trustPolicy` is reported to the lead, never resolved
# by the implementer alone; only a recorded ruling adds a `trustPolicyExclude` entry (R-28
# below). `@nestjs/cli@11.0.24` pins `chokidar@4.0.3`, which
# lacks an npm provenance attestation (4.0.0/4.0.1 have one, 4.0.2/4.0.3 do not; registry
# check 2026-09-28), tripping `no-downgrade`. Pin the dependency to the last provenance-
# carrying release instead of excluding the trust check. See ADR-0001 (review fix, round 1).
overrides:
  chokidar: 4.0.1
  # GHSA-667r-xxjv-c9mm, GHSA-p68q-wchp-6fh7, GHSA-hwr6-493r-vm6h, GHSA-9q9j-q6p8-xq58 (high, fastify <5.12.2):
  # @nestjs/platform-fastify@11.2.6 pins fastify 5.11.3 exactly. See ADR-0001 (2026-10-01).
  fastify: 5.12.5

# Audit exceptions: exact advisories with no patched version, reached only through the mobile build
# toolchain (never the api or web images). One ADR-0001 row each; re-check 2026-11-02 and on every
# Expo SDK or Metro bump, and remove an entry as soon as a fixed version exists.
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv # node-forge <=1.4.0 (high): expo > @expo/cli, @expo/code-signing-certificates
    - GHSA-vfj7-8cjw-p6xm # braces <=3.0.3 (high): react-native/expo > metro > micromatch

# Owner ruling R-28 (docs/delivery/rulings.md): exact `name@version` trust-policy exceptions
# only, never a range, bare name or pattern; `trustPolicy: no-downgrade` stays on for everything
# else. Every entry has an ADR-0001 row with the reason, dependency path and re-check date.
trustPolicyExclude:
  - 'semver@6.3.1'
  - 'ua-parser-js@1.0.41'

# Exact versions only (never a bare name or a pattern). Every entry has an ADR-0001 row with an expiry.
