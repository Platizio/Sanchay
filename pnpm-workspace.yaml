  '@node-rs/argon2': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  cpu-features: false
  esbuild: true
  lefthook: true
  msw: false
  protobufjs: false
  sharp: true
  ssh2: false
  unrs-resolver: true

